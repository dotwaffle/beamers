services:
  beamers:
    image: ${BEAMERS_IMAGE:?set BEAMERS_IMAGE to the loaded Beamers image}
    pull_policy: never
    command:
      - serve
      - --data-dir=/var/lib/beamers/data
      - --attachments-dir=/var/lib/beamers/attachments
      - --listen=0.0.0.0:8443
      - --tls-cert=/run/secrets/tls.crt
      - --tls-key=/run/secrets/tls.key
      - --shutdown-timeout=30s
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 4G
    ports:
      - "${BEAMERS_PORT:-8443}:8443"
    volumes:
      - beamers-data:/var/lib/beamers
    secrets:
      - tls.crt
      - tls.key
    healthcheck:
      test:
        - CMD
        - wget
        - --no-check-certificate
        - --quiet
        - --output-document=/dev/null
        - https://127.0.0.1:8443/readyz
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 35s

volumes:
  beamers-data:

secrets:
  tls.crt:
    file: ${BEAMERS_TLS_CERT:?set BEAMERS_TLS_CERT to a readable certificate}
  tls.key:
    file: ${BEAMERS_TLS_KEY:?set BEAMERS_TLS_KEY to its private key}
