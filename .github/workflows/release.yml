name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore Go caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Install toolchain
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run canonical checks
        run: mise run check

      - name: Verify release and deployment artifacts
        env:
          BEAMERS_FULL_DEPLOYMENT_CHECK: "1"
          BEAMERS_SYSTEMD_RUNTIME_CHECK: "1"
        run: scripts/check-deployments.sh

      - name: Build artifacts
        run: |
          version=${GITHUB_REF_NAME#v}
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          scripts/build-release.sh "$version"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/beamers-linux-amd64 \
            dist/beamers-linux-amd64.sha256 \
            dist/beamers-image-linux-amd64.tar \
            dist/beamers-image-linux-amd64.tar.sha256 \
            dist/beamers-oci-linux-amd64.tar \
            dist/beamers-oci-linux-amd64.tar.sha256 \
            --verify-tag \
            --draft \
            --generate-notes
