name: Browsers

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: browsers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Resolve supported versions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}

    steps:
      - name: Resolve current and previous container images
        id: versions
        shell: bash
        run: |
          latest_majors() {
            image="$1"
            url="https://hub.docker.com/v2/repositories/selenium/standalone-${image}/tags?page_size=100"
            majors='[]'
            while [ -n "$url" ]; do
              response="$(
                curl --fail --silent --show-error --location "$url"
              )"
              majors="$(
                jq --compact-output --argjson known "$majors" \
                  '$known + [.results[].name |
                    select(test("^[0-9]+[.]0$")) |
                    split(".")[0] | tonumber] |
                    unique | sort' \
                  <<<"$response"
              )"
              if [ "$(jq 'length' <<<"$majors")" -ge 2 ]; then
                break
              fi
              url="$(jq --raw-output '.next // empty' <<<"$response")"
            done
            if [ "$(jq 'length' <<<"$majors")" -lt 2 ]; then
              echo "fewer than two major tags found for $image" >&2
              return 1
            fi
            jq --compact-output '.[-2:]' <<<"$majors"
          }

          chrome_majors="$(latest_majors chrome)"
          firefox_majors="$(latest_majors firefox)"
          chrome_previous_major="$(jq --raw-output '.[0]' <<<"$chrome_majors")"
          chrome_major="$(jq --raw-output '.[1]' <<<"$chrome_majors")"
          firefox_previous_major="$(jq --raw-output '.[0]' <<<"$firefox_majors")"
          firefox_major="$(jq --raw-output '.[1]' <<<"$firefox_majors")"

          matrix="$(
            jq --compact-output --null-input \
              --argjson chrome_major "$chrome_major" \
              --argjson chrome_previous_major "$chrome_previous_major" \
              --argjson firefox_major "$firefox_major" \
              --argjson firefox_previous_major "$firefox_previous_major" \
              '{include: [
                {engine: "chromium", role: "current",
                  image: ("selenium/standalone-chrome:" + ($chrome_major | tostring) + ".0"),
                  major: $chrome_major},
                {engine: "chromium", role: "previous",
                  image: ("selenium/standalone-chrome:" + ($chrome_previous_major | tostring) + ".0"),
                  major: $chrome_previous_major},
                {engine: "firefox", role: "current",
                  image: ("selenium/standalone-firefox:" + ($firefox_major | tostring) + ".0"),
                  major: $firefox_major},
                {engine: "firefox", role: "previous",
                  image: ("selenium/standalone-firefox:" + ($firefox_previous_major | tostring) + ".0"),
                  major: $firefox_previous_major}
              ]}'
          )"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  certify:
    name: ${{ matrix.engine }} ${{ matrix.role }}
    needs: versions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore Go caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Install toolchain
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Certify browser
        env:
          BEAMERS_BROWSER_CERTIFICATION: "1"
          BEAMERS_BROWSER_ENGINE: ${{ matrix.engine }}
          BEAMERS_BROWSER_ROLE: ${{ matrix.role }}
          BEAMERS_BROWSER_MAJOR: ${{ matrix.major }}
          BEAMERS_SELENIUM_IMAGE: ${{ matrix.image }}
          BEAMERS_BROWSER_REPORT: ${{ github.workspace }}/artifacts/browser.json
        run: |
          set -o pipefail
          mkdir -p artifacts
          scripts/check-browser.sh 2>&1 | tee artifacts/browser.log

      - name: Report browser evidence
        if: always()
        run: |
          if [ -f artifacts/browser.json ]; then
            echo "::notice title=Browser evidence::$(jq -c . artifacts/browser.json)"
          elif [ -f artifacts/browser.log ]; then
            while IFS= read -r line; do
              echo "::error title=Browser certification::$line"
            done < <(tail -n 20 artifacts/browser.log)
          fi

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ matrix.engine }}-${{ matrix.role }}-${{ github.run_id }}
          path: |
            artifacts/browser.json
            artifacts/browser.log
          if-no-files-found: ignore
          retention-days: 30
