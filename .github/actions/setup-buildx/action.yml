name: Set up pinned Docker Buildx
description: Select the repository container-build toolchain

runs:
  using: composite
  steps:
    - name: Read container-build toolchain
      id: toolchain
      shell: sh
      run: |
        . "$GITHUB_ACTION_PATH/../../../build/toolchain.env"
        echo "buildx_version=$BUILDX_VERSION" >>"$GITHUB_OUTPUT"
        echo "buildkit_image=$BUILDKIT_IMAGE" >>"$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        version: ${{ steps.toolchain.outputs.buildx_version }}
        driver-opts: image=${{ steps.toolchain.outputs.buildkit_image }}
