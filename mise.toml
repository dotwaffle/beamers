min_version = "2026.7.12"

[settings]
lockfile = true

[tool_alias]
govulncheck = "go:golang.org/x/vuln/cmd/govulncheck"
templ = "go:github.com/a-h/templ/cmd/templ"

[tools]
actionlint = "1"
atlas = "1"
buf = "1"
go = "1.26"
golangci-lint = "2"
govulncheck = "1"
node = "24"
"go:connectrpc.com/connect/cmd/protoc-gen-connect-go" = "1.20.0"
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "1.36.11"
rumdl = "0.2"
shellcheck = "latest"
templ = "0.3.1020"

[tasks.format]
description = "Format Go and Markdown sources"
run = """
golangci-lint fmt
rumdl fmt .
"""

[tasks.lint]
description = "Run static analysis"
run = """
actionlint
buf lint
golangci-lint run
rumdl check .
shellcheck scripts/*.sh
"""

[tasks.test]
description = "Run the quick test suite"
run = """
sh scripts/check-release-evidence_test.sh
go test ./...
"""

[tasks.test-race]
description = "Run the complete test suite with the race detector"
run = """
sh scripts/check-release-evidence_test.sh
go test -race ./...
"""

[tasks.browser-test]
description = "Run deterministic Display client recovery tests"
run = "node --test internal/displays/client_test.js internal/frontend/event_time_test.js internal/programview/control_test.js"

[tasks.vulncheck]
description = "Check Go dependencies for known vulnerabilities"
run = "govulncheck ./..."

[tasks.migrations]
description = "Validate migration checksums and Ent schema parity"
run = "sh scripts/check-migrations.sh"

[tasks.check]
description = "Run the canonical validation sweep"
depends = ["browser-test", "lint", "migrations", "test-race", "vulncheck"]
run = "go build ./..."
